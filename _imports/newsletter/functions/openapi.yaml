openapi: 3.0.3
info:
  title: Artometrics Newsletter API
  version: 1.0.0
  description: |
    Desk and public endpoints for the Artometrics letter.
    Admin routes require `Authorization: Bearer <Firebase ID token>` for
    team@artometrics.com or kylesmcauliffe@gmail.com, with a verified email.
    When RESEND_API_KEY is missing, a placeholder, or the process is the
    emulator, sends are written to the dry-run log and no mail is delivered.
servers:
  - url: https://us-west1-newsletter-510519.cloudfunctions.net/api
    description: Cloud Functions gen2, us-west1
  - url: http://127.0.0.1:5291/api
    description: Local API against the emulators
tags:
  - name: public
  - name: desk
  - name: tracking
paths:
  /health:
    get:
      tags: [public]
      summary: Service health, transport mode, and the postal address
      operationId: health
      responses:
        '200':
          description: The back end is enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      tags: [public]
      summary: This specification
      operationId: openapi
      responses:
        '200':
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /subscribe:
    post:
      tags: [public]
      summary: Start double opt-in
      operationId: subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, consent]
              properties:
                email:
                  type: string
                  format: email
                consent:
                  type: boolean
                  description: Must be true. The server stores the canonical consent sentence and the time.
                source:
                  type: string
                website:
                  type: string
                  description: Honeypot. Must be empty.
      responses:
        '200':
          description: Generic confirmation message. Does not reveal whether the address was already on the list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/Error'
  /confirm:
    get:
      tags: [public]
      summary: Confirm a subscription
      operationId: confirm
      parameters:
        - $ref: '#/components/parameters/token'
      responses:
        '200':
          description: The address is confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                    enum: [confirmed]
                  email:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
  /unsubscribe:
    get:
      tags: [public]
      summary: Human unsubscribe
      operationId: unsubscribeGet
      parameters:
        - $ref: '#/components/parameters/token'
      responses:
        '200':
          description: The address is off the list. Repeat calls return 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unsubscribed'
        '400':
          $ref: '#/components/responses/Error'
    post:
      tags: [public]
      summary: One-click unsubscribe (RFC 8058)
      description: |
        Mail clients POST `List-Unsubscribe=One-Click` to the HTTPS URI in the
        List-Unsubscribe header. The token stays in the query string.
      operationId: unsubscribePost
      parameters:
        - $ref: '#/components/parameters/token'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                List-Unsubscribe:
                  type: string
                  example: One-Click
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unsubscribed'
        '400':
          $ref: '#/components/responses/Error'
  /archive:
    get:
      tags: [public]
      summary: Sent letters, newest first
      operationId: archive
      responses:
        '200':
          description: Public archive
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
  /archive/{slug}:
    get:
      tags: [public]
      summary: One sent letter
      operationId: archiveOne
      parameters:
        - $ref: '#/components/parameters/slug'
      responses:
        '200':
          description: The letter
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: '#/components/schemas/Issue'
        '404':
          $ref: '#/components/responses/Error'
  /draft:
    post:
      tags: [desk]
      summary: Draft a letter from notes or a URL
      operationId: draftIssue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                url:
                  type: string
                  format: uri
                save:
                  type: boolean
                  description: When true, store the draft as an issue.
      responses:
        '200':
          description: Draft text, and the saved issue when save is true
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /subscribers/count:
    get:
      tags: [desk]
      summary: Count subscribers
      operationId: subscriberCount
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, unsubscribed]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    type: integer
                  confirmed:
                    type: integer
                  unsubscribed:
                    type: integer
                  total:
                    type: integer
                  status:
                    type: string
                  count:
                    type: integer
  /subscribers:
    get:
      tags: [desk]
      summary: List subscribers without mail tokens
      operationId: listSubscribers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, unsubscribed]
      responses:
        '200':
          description: Subscriber rows
  /issues:
    get:
      tags: [desk]
      summary: List every letter on the desk
      operationId: listIssues
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Issues
    post:
      tags: [desk]
      summary: Create a draft
      operationId: createIssue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueWrite'
      responses:
        '201':
          description: Created
  /issues/{id}:
    get:
      tags: [desk]
      summary: Read one letter, including drafts
      operationId: getIssue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Issue
    patch:
      tags: [desk]
      summary: Edit a draft or scheduled letter
      operationId: updateIssue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueWrite'
      responses:
        '200':
          description: Updated
  /issues/{id}/send:
    post:
      tags: [desk]
      summary: Send a letter to confirmed subscribers in batches
      operationId: sendIssue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Send result. transport is dry-run when Resend is not live.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  sent:
                    type: integer
                  failed:
                    type: integer
                  transport:
                    type: string
                    enum: [dry-run, resend]
  /issues/{id}/schedule:
    post:
      tags: [desk]
      summary: Schedule a letter
      operationId: scheduleIssue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Scheduled issue
  /scheduled/process:
    post:
      tags: [desk]
      summary: Send letters whose schedule is due
      operationId: processScheduled
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Per-letter results
  /stats:
    get:
      tags: [desk]
      summary: Subscriber totals and per-letter counts
      operationId: stats
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Counts
  /stats/{issueId}:
    get:
      tags: [desk]
      summary: Counts for one letter
      operationId: issueStats
      security:
        - bearerAuth: []
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One letter plus list totals
  /dry-runs:
    get:
      tags: [desk]
      summary: Mail that was logged instead of sent
      operationId: dryRuns
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent dry-run messages, including headers and HTML
  /track/open/{token}:
    get:
      tags: [tracking]
      summary: Open pixel
      operationId: trackOpen
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A 1x1 gif. Unknown tokens still return the gif.
          content:
            image/gif:
              schema:
                type: string
                format: binary
  /track/click/{token}:
    get:
      tags: [tracking]
      summary: Click redirect
      operationId: trackClick
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: u
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the original http(s) URL
        '400':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  parameters:
    token:
      name: token
      in: query
      required: true
      schema:
        type: string
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Message:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
    Unsubscribed:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [unsubscribed]
    Health:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        projectId:
          type: string
        region:
          type: string
        transport:
          type: string
          enum: [dry-run, resend]
        gemini:
          type: string
          enum: [off, ready]
        address:
          type: array
          items:
            type: string
        addressIsPlaceholder:
          type: boolean
        consentText:
          type: string
    Stats:
      type: object
      properties:
        recipients:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        opens:
          type: integer
        uniqueOpens:
          type: integer
        clicks:
          type: integer
        uniqueClicks:
          type: integer
        unsubscribes:
          type: integer
    Issue:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        subject:
          type: string
        preheader:
          type: string
        dek:
          type: string
        bodyMarkdown:
          type: string
        status:
          type: string
          enum: [draft, scheduled, sending, sent, failed]
        sentAt:
          type: string
          format: date-time
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        physicalAddress:
          type: array
          items:
            type: string
        stats:
          $ref: '#/components/schemas/Stats'
    IssueWrite:
      type: object
      properties:
        title:
          type: string
        slug:
          type: string
        subject:
          type: string
        preheader:
          type: string
        dek:
          type: string
        bodyMarkdown:
          type: string
