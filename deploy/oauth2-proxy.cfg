provider = "google"
http_address = "127.0.0.1:4180"
upstreams = ["static://202"]
redirect_url = "https://2-29-173-68.sslip.io/oauth2/callback"
email_domains = ["*"]
authenticated_emails_file = "/etc/dawn/allowed-emails.txt"
cookie_name = "_oauth2_proxy"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_domains = ["2-29-173-68.sslip.io"]
cookie_expire = "720h"
reverse_proxy = true
set_xauthrequest = true
pass_user_headers = true
pass_access_token = false
skip_provider_button = true
silence_ping_logging = true
# Client id, client secret, and cookie secret come from the environment:
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
# (oauth2-proxy also accepts OAUTH2_PROXY_CLIENT_ID and OAUTH2_PROXY_CLIENT_SECRET).
